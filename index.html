<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 NEXUS</h1>
            <p class="subtitle">Твой AI ассистент с голосом и зрением</p>
        </div>

        <div class="status" id="status">
            <span class="status-dot offline"></span>
            <span id="statusText">Не подключен</span>
        </div>

        <div class="video-container">
            <video id="userVideo" autoplay muted playsinline></video>
            <canvas id="screenCanvas"></canvas>
            <div class="ai-avatar" id="aiAvatar">
                <div class="pulse"></div>
                <span>N</span>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">🎤 Начать сессию</button>
            <button id="stopBtn" class="btn btn-danger" disabled>⏹️ Остановить</button>
            <button id="shareScreenBtn" class="btn btn-secondary" disabled>🖥️ Поделиться экраном</button>
        </div>

        <div class="transcript-container">
            <h3>💬 Разговор</h3>
            <div id="transcript" class="transcript"></div>
        </div>

        <div class="settings">
            <h3>⚙️ Настройки</h3>
            <div class="settings-grid">
                <div class="setting-item">
                    <label for="apiKey">OpenRouter API Key:</label>
                    <input type="password" id="apiKey" placeholder="sk-or-v1-...">
                    <small>Получи на <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></small>
                </div>
                <div class="setting-item">
                    <label for="elevenLabsKey">ElevenLabs API Key:</label>
                    <input type="password" id="elevenLabsKey" placeholder="...">
                    <small>Получи на <a href="https://elevenlabs.io" target="_blank">elevenlabs.io</a></small>
                </div>
                <div class="setting-item">
                    <label for="aiName">Имя AI:</label>
                    <input type="text" id="aiName" value="NEXUS" placeholder="NEXUS">
                </div>
                <div class="setting-item">
                    <label for="voiceId">Голос (ElevenLabs Voice ID):</label>
                    <input type="text" id="voiceId" value="21m00Tcm4TlvDq8ikWAM" placeholder="21m00Tcm4TlvDq8ikWAM">
                    <small>Rachel (женский) по умолчанию</small>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
